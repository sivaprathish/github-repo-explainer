[project]
name = "github-repo-explainer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gitpython>=3.1.57",
    "langchain>=1.3.14",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langsmith>=0.10.15",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.2",
    "pygithub>=2.4.0",
    "streamlit>=1.60.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "langchain-core>=1.5.3",
    "langgraph>=1.2.10",
    "langchain-community>=0.4.2",
    "faiss-cpu>=1.14.3",
    "langchain-text-splitters>=1.1.2",
]

[project.scripts]
github-repo-explainer = "github_repo_explainer:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
